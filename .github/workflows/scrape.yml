name: Scrape Events Daily

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install

    - name: Run scraper
      run: yarn scrape

    - name: Optimise downloaded images
      run: yarn optimise-images

    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # Format before staging so this check reflects the real final diff — the
        # pre-commit hook reformats these same JSON files too, and when a scrape
        # finds no actual event changes, that reformatting alone was collapsing an
        # already-empty diff into "empty after formatting," which lint-staged's own
        # empty-commit guard then hard-failed on instead of just skipping quietly.
        yarn prettier --write public/data/events.json public/data/operators.json public/data/operator_debuts.json
        git add public/data/events.json public/data/images/ public/data/operators.json public/data/operator_debuts.json
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update events"
          git push
        fi
