name: Deploy Staging to GitHub Pages

on:
  push:
    branches:
      - staging
  workflow_dispatch: {}

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd src/client
          yarn install --frozen-lockfile || npm ci

      - name: Build client
        env:
          VITE_BASE_PATH: /ak-events/staging/
        run: |
          cd src/client
          yarn build || npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Publish into a subdirectory of the same branch the production app and
          # Storybook use, and never wipe sibling content when doing so — same
          # isolation mechanism deploy-storybook.yml already relies on.
          destination_dir: staging
          keep_files: true
