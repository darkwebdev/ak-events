name: Debug arkpedia (temporary)
on:
  push:
    branches: [claude/debug-arkpedia]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -A "Mozilla/5.0" -o ap.html "https://www.arkpedia.net/events/%5BCelebration%5D%20Critical%20Phase%20Transition"
          python3 - <<'PY'
          import re, json
          h = open('ap.html').read()
          m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', h, re.S)
          p = json.loads(m.group(1))['props']['pageProps']
          print('KEYS', list(p.keys()))
          for k, v in p.items():
              s = json.dumps(v, ensure_ascii=False)
              print('==', k, len(s), s[:200])
          def walk(o, path):
              if isinstance(o, dict):
                  if any('Permit' in str(x) for x in o.values() if isinstance(x, str)):
                      print('PERMIT', path, json.dumps(o, ensure_ascii=False)[:400])
                  for k, v in o.items(): walk(v, path + '.' + k)
              elif isinstance(o, list):
                  for i, v in enumerate(o): walk(v, path + f'[{i}]')
          walk(p, 'pageProps')
          for k in p:
              if 'login' in k.lower() or 'reward' in k.lower():
                  print('FULL', k, json.dumps(p[k], ensure_ascii=False)[:6000])
          PY
